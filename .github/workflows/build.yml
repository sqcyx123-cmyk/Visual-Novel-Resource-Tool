name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore VisualNovelResourceTool.sln
      - name: Build
        run: dotnet build VisualNovelResourceTool.sln -c Release --no-restore
      - name: Test
        run: dotnet run --project VisualNovelResourceTool.Tests -c Release --no-build
      - name: Publish Windows x64
        run: dotnet publish VisualNovelResourceTool.App -c Release -r win-x64 --self-contained true -o publish
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VisualNovelResourceTool-win-x64
          path: publish/**
