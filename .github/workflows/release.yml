name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore VisualNovelResourceTool.sln

      - name: Test
        run: dotnet test VisualNovelResourceTool.Tests -c Release --no-restore

      - name: Publish Windows x64
        run: dotnet publish VisualNovelResourceTool.App -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish

      - name: Create archive
        shell: pwsh
        run: Compress-Archive -Path publish\* -DestinationPath "VisualNovelResourceTool-${{ github.ref_name }}-win-x64.zip"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          files: VisualNovelResourceTool-${{ github.ref_name }}-win-x64.zip
